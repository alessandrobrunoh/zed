# Preview source: feat/ssh-forward-ui @ ddd8ffbf0378598dd67b3a96e597d836021ac3cb
name: Check and build SSH forwarding preview for macOS

on:
  workflow_dispatch:
  push:
    branches:
      - ci/ssh-forward-ui-macos
    paths:
      - .github/workflows/ssh-forward-ui-macos.yml

permissions:
  contents: read

concurrency:
  group: ssh-forward-ui-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check affected crates
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Check out preview branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Prepare macOS tools
        run: |
          xcodebuild -version
          command -v cmake || brew install cmake
          rustup show
          df -h .

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Check affected crate targets
        run: cargo check --package recent_projects --package title_bar --all-targets --target aarch64-apple-darwin

  test-port-forwarding:
    name: Port forwarding UI tests (6)
    needs: check
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_INCREMENTAL: 'false'
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Check out preview branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Prepare macOS test tools
        run: |
          xcodebuild -version
          command -v cmake || brew install cmake
          rustup show
          df -h .

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Run the six new port forwarding UI tests
        run: |
          status=0
          for test_name in \
            tab_moves_between_port_forward_endpoint_inputs \
            port_forwarding_popover_adapts_to_narrow_windows \
            add_edit_and_validate_port_forward_inputs \
            saving_a_port_forward_updates_ssh_settings \
            deleting_a_port_forward_requires_confirmation \
            clicking_outside_the_port_forwarding_popover_emits_dismiss
          do
            echo "Running $test_name"
            cargo test --package recent_projects --lib --target aarch64-apple-darwin "$test_name" || status=1
          done
          exit "$status"

  test-title-bar:
    name: SSH title bar UI test (1)
    needs: check
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_INCREMENTAL: 'false'
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Check out preview branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Prepare macOS test tools
        run: |
          xcodebuild -version
          command -v cmake || brew install cmake
          rustup show
          df -h .

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Run the new title bar integration test
        run: cargo test --package title_bar --lib --target aarch64-apple-darwin port_forwarding_button_follows_worktree_and_branch_controls

  build:
    name: Build macOS Apple Silicon app
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Check out preview branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Prepare macOS build tools
        run: |
          xcodebuild -version
          command -v cmake || brew install cmake
          rustup show
          df -h .

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Bundle debug app with embedded assets
        run: |
          # The bundler's final remote-server archive incorrectly hardcodes
          # release even when -d selects debug. Adjust only the CI checkout.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("script/bundle-mac")
          source = path.read_text()
          source = source.replace(
              "target/$target_triple/release/remote_server",
              "target/$target_triple/$target_dir/remote_server",
          )
          path.write_text(source)
          PY
          ./script/bundle-mac -d aarch64-apple-darwin

      - name: Archive app
        run: |
          app_path=$(find "target/aarch64-apple-darwin/debug/bundle" -maxdepth 3 -type d -name '*.app' -print -quit)
          test -n "$app_path"
          codesign --verify --deep --strict "$app_path"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "dist/Zed-SSH-Preview-apple-silicon.zip"
          {
            echo "### SSH forwarding preview — Apple Silicon"
            echo "Source commit: ${{ github.sha }}"
            echo "Download the artifact below, extract both ZIP layers, then open the app."
            echo "This is an ad-hoc signed development app, without Apple notarization."
            echo "The local Port forwarding preview is enabled in this debug build."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload macOS app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Zed-SSH-Preview-apple-silicon
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

# Preview source: feat/ssh-forward-ui @ ddd8ffbf0378598dd67b3a96e597d836021ac3cb
name: Check and build SSH forwarding preview for macOS

on:
  workflow_dispatch:
  push:
    branches:
      - ci/ssh-forward-ui-macos
    paths:
      - .github/workflows/ssh-forward-ui-macos.yml

permissions:
  contents: read

concurrency:
  group: ssh-forward-ui-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan workspace test shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - name: Check out preview branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Create package matrix
        id: shards
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          import pathlib
          import tomllib

          root = pathlib.Path(".")
          with (root / "Cargo.toml").open("rb") as file:
              workspace = tomllib.load(file)["workspace"]

          members = set()
          for pattern in workspace["members"]:
              matches = glob.glob(pattern, recursive=True) if "*" in pattern else [pattern]
              members.update(matches)

          packages = []
          for member in sorted(members):
              manifest = root / member / "Cargo.toml"
              if not manifest.is_file():
                  continue
              with manifest.open("rb") as file:
                  package = tomllib.load(file).get("package")
              if package and package.get("name"):
                  packages.append(package["name"])

          shard_count = 8
          shards = [[] for _ in range(shard_count)]
          for index, package in enumerate(packages):
              shards[index % shard_count].append(package)

          matrix = {
              "include": [
                  {"shard": index + 1, "packages": group}
                  for index, group in enumerate(shards)
                  if group
              ]
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps(matrix) + "\n")
          print(f"Split {len(packages)} workspace packages across {len(matrix['include'])} test shards")
          PY

  check:
    name: Check all workspace targets
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Check out preview branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Prepare macOS tools
        run: |
          xcodebuild -version
          command -v cmake || brew install cmake
          rustup show
          df -h .

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Check every workspace target
        run: cargo check --workspace --all-targets --target aarch64-apple-darwin

  test:
    name: Workspace tests (shard ${{ matrix.shard.shard }})
    needs: [plan, check]
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_INCREMENTAL: 'false'
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      PACKAGES: ${{ toJSON(matrix.shard.packages) }}
    steps:
      - name: Check out preview branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Prepare macOS test tools
        run: |
          xcodebuild -version
          command -v cmake || brew install cmake
          rustup show
          df -h .

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Run this workspace test shard
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          packages = json.loads(os.environ["PACKAGES"])
          command = [
              "cargo", "test", "--no-fail-fast",
              "--target", "aarch64-apple-darwin",
          ]
          for package in packages:
              command.extend(["--package", package])
          print("Running tests for: " + ", ".join(packages))
          subprocess.run(command, check=True)
          PY

  build:
    name: Build macOS Apple Silicon app
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Check out preview branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Prepare macOS build tools
        run: |
          xcodebuild -version
          command -v cmake || brew install cmake
          rustup show
          df -h .

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Bundle debug app with embedded assets
        run: |
          # The bundler's final remote-server archive incorrectly hardcodes
          # release even when -d selects debug. Adjust only the CI checkout.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("script/bundle-mac")
          source = path.read_text()
          source = source.replace(
              "target/$target_triple/release/remote_server",
              "target/$target_triple/$target_dir/remote_server",
          )
          path.write_text(source)
          PY
          ./script/bundle-mac -d aarch64-apple-darwin

      - name: Archive app
        run: |
          app_path=$(find "target/aarch64-apple-darwin/debug/bundle" -maxdepth 3 -type d -name '*.app' -print -quit)
          test -n "$app_path"
          codesign --verify --deep --strict "$app_path"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "dist/Zed-SSH-Preview-apple-silicon.zip"
          {
            echo "### SSH forwarding preview — Apple Silicon"
            echo "Source commit: ${{ github.sha }}"
            echo "Download the artifact below, extract both ZIP layers, then open the app."
            echo "This is an ad-hoc signed development app, without Apple notarization."
            echo "The local Port forwarding preview is enabled in this debug build."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload macOS app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Zed-SSH-Preview-apple-silicon
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
